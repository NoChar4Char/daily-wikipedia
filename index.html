<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Wikipedia</title>
    <script type="module" src="/src/index.js"></script>
    <link rel="icon" type="image/webp" href="/image/bronze-wiki.webp" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="./">Today</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="?view=archive">Archive</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="#">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="daily-article">
      <section class="niche-selector">
        <label class="niche-selector__label" for="niche-level"
          >How niche? (1–5)</label
        >
        <select
          class="niche-selector__input"
          id="niche-level"
          name="niche-level"
        >
          <option value="1">1 – Common ball</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5 – Very niche</option>
        </select>
      </section>

      <article class="article">
        <h1 class="article__title">Loading…</h1>
        <p class="article__date"></p>
        <p class="article__description"></p>
        <img class="article__thumb" alt="" hidden />
        <p class="article__summary"></p>
        <a class="article__link" href="#" hidden
          >Read the full article on Wikipedia</a
        >
        <p class="article__views"></p>
      </article>

      <p class="article__next"></p>
    </main>

    <main class="archive" hidden>
      <h1 class="archive__title">Archive</h1>
      <ul class="archive__list"></ul>
    </main>

    <footer class="site-footer">
      <nav class="footer-nav">
        <ul class="footer-nav__list">
          <li class="footer-nav__item">
            <a class="footer-nav__link" href="#">Contact</a>
          </li>
          <li class="footer-nav__item">
            <a class="footer-nav__link" href="https://www.wikipedia.org/"
              >Wikipedia</a
            >
          </li>
          <li class="footer-nav__item">
            <a
              class="footer-nav__link"
              href="https://github.com/NoChar4Char/daily-wikipedia"
              >Source Code</a
            >
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
